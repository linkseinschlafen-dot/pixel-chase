<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>像素追逐</title>
<style>
  :root { --bg: #1a1020; --ink: #fff; --accent: #ff5a8a; --gold: #ffd23f; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink);
         display: flex; align-items: center; justify-content: center; padding: 16px;
         font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', monospace; }
  .stage { position: relative; width: min(100%, 1280px); aspect-ratio: 16 / 9; overflow: hidden;
           border: 4px solid #000; box-shadow: 0 0 0 4px var(--gold); background: #000; }
  #game { display: block; width: 100%; height: 100%; }
  .overlay { position: absolute; inset: 0; display: flex; flex-direction: column; gap: 14px;
             align-items: center; justify-content: center; background: rgba(26, 16, 32, .55); }
  .overlay.hidden { display: none; }
  .btn { font: inherit; font-weight: 700; font-size: clamp(16px, 3vw, 28px); color: var(--bg);
         background: var(--gold); border: 4px solid #000; box-shadow: 6px 6px 0 #000;
         padding: 12px 28px; cursor: pointer; animation: hop 1s steps(2) infinite; }
  .hint { font-size: clamp(12px, 1.6vw, 16px); opacity: .85; text-align: center; }
  @keyframes hop { 50% { transform: translateY(-3px); } }
  .mute { position: absolute; right: 10px; bottom: 10px; font: inherit; font-size: 14px; font-weight: 700;
          color: var(--ink); background: rgba(0,0,0,.55); border: 2px solid #fff; padding: 4px 10px; cursor: pointer; }
  .banner { position: absolute; left: 50%; top: 22%; transform: translate(-50%, -50%) scale(.6); opacity: 0;
            font-weight: 900; font-size: clamp(18px, 4.2vw, 46px); color: var(--gold); letter-spacing: .08em;
            text-shadow: 3px 3px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000;
            transition: transform .35s cubic-bezier(.3,1.6,.5,1), opacity .25s; pointer-events: none; white-space: nowrap; }
  .banner.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  .banner small { display: block; font-size: .42em; color: #fff; text-align: center; letter-spacing: .3em; }
</style>
</head>
<body>
<div class="stage">
  <svg id="game" viewBox="0 0 320 180" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg">
    <defs id="defs"></defs>
    <g id="world">
      <g id="bg"></g>
      <g id="props"></g>
      <g id="actors"></g>
      <g id="fg"></g>
      <g id="fx"></g>
      <g id="talk"></g>
    </g>
    <g id="hud"></g>
  </svg>
  <div class="banner" id="banner"></div>
  <div class="overlay" id="overlay">
    <button class="btn" id="start">▶ 点击开始</button>
    <div class="hint">有声音，记得开音量</div>
  </div>
  <button class="mute" id="mute" hidden>🔊 声音</button>
</div>
<script>
'use strict';
// ====================================================================
//  基础
// ====================================================================
const NS = 'http://www.w3.org/2000/svg';
const $ = id => document.getElementById(id);
const lerp = (a, b, u) => a + (b - a) * u;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const ease = u => u * u * (3 - 2 * u);
function el(tag, attrs = {}, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
function g(html, parent, attrs = {}) {
  const e = el('g', attrs, parent);
  e.innerHTML = html;
  return e;
}
const R = (x, y, w, h, c, extra = '') => `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${c}" ${extra}/>`;

// ====================================================================
//  像素角色（温知窈 / 裴恕）
// ====================================================================
const PAL = {
  s: '#ffe0cc', e: '#3a2216', c: '#ff9aa8', w: '#ffffff', r: '#e8344e',
  // 温知窈：棕发、蓝蝶簪、珍珠、浅粉纱衣、粉腰带
  H: '#6b3e26', b: '#5aa8e8', q: '#f4f0e8', P: '#ffc8da', p: '#f29ab8', R: '#e0607f',
  // 裴恕：黑纱官帽金框金翅、黑底金龙袍、红衬里
  K: '#141014', n: '#1e1418', G: '#e4b440', g: '#a87c22', d: '#2c2228', x: '#a01c2c',
};
const GIRL_TOP = [
  ".....HHHH.......", "....HHHHHHbb....", "...HHHHHHHHbb...", "...HHHHHHHHHq...",
  "..HHHHHsssssH...", "..HHHHssssess...", "..HHHHsssssss...", "..HHHHsssscs....",
  "..HHHHHsssss....", "..HHHHwPPPws....", "..HHHPPwwPPPP...", "..HHPPPPPPPPs...",
  "...HPRRRRRRP....", "...HPPPRRPPPP...", "...PPPPRPPPPPP..", "..PPPPPRPPPPPP..",
  "..PPPPPPPPPPP...", "..PPPpPPPPpPP...", ".PPPPpPPPPpPPP..", ".PPPPpPPPPpPPP..",
  ".PPPPPPPPPPPPP..", "..PPPPPPPPPPP...",
];
const BOY_TOP = [
  "......GG........", ".....KKKK.......", "....KKKKKK......", "....KKGGKK......",
  "GG.GGGGGGGG.GG..", "G..nssssssn..G..", "G..nsssesss..G..", "g..nssssss...g..",
  "...nnssss.......", "..nnwxdddd......", "..nKdwxdddd.....", ".KddGdxddddK....",
  ".dddGGGGGGGd....", ".sddGdxdGddds...", ".dddGdxddGddd...", "xdddddxddddddx..",
  "xddGdddxddGdddx.", ".ddddddxdddddd..", ".dGdddxxxdddGd..", ".dddGddxddGddd..",
  ".dddddddddddddd.", ".GGGGGGGGGGGGGG.",
];
const legs = {
  girlA: ["...pp.....pp....", "...pp.....pp...."], girlB: ["......pppp......", "......pppp......"],
  girlS: ["....pp...pp.....", "....pp...pp....."],
  boyA: ["..KK......KK....", "..KK......KK...."], boyB: ["......KKKK......", "......KKKK......"],
  boyS: ["...KK....KK.....", "...KK....KK....."],
};
function edit(rows, cells) {
  const r = rows.map(s => s.split(''));
  for (const [x, y, c] of cells) r[y][x] = c;
  return r.map(a => a.join(''));
}
const xEye = (cx, cy) => [[cx-1,cy-1,'e'],[cx+1,cy-1,'e'],[cx,cy,'e'],[cx-1,cy+1,'e'],[cx+1,cy+1,'e']];
function noHat(rows) {
  return rows.map((row, y) => {
    if (y < 4) return '.'.repeat(16);
    if (y === 4) return '...nnnnnnnn.....';
    if (y <= 7) return row.split('').map((c, x) => (x === 0 || x === 13) ? '.' : c).join('');
    return row;
  });
}
const HAT = BOY_TOP.slice(0, 8).map((row, y) => row.split('').map((c, x) =>
  ((y <= 4 && 'KGg'.includes(c)) || (y >= 5 && (x === 0 || x === 13) && c !== '.')) ? c : '.').join(''));

const GIRL = {
  runA: GIRL_TOP.concat(legs.girlA), runB: GIRL_TOP.concat(legs.girlB), stand: GIRL_TOP.concat(legs.girlS),
};
GIRL.hurt = edit(GIRL.stand, xEye(10, 5));
GIRL.hurtRun = edit(GIRL.runA, xEye(10, 5));
GIRL.angry = edit(GIRL.runA, [[9,6,'r'],[10,6,'r'],[11,6,'r'],[9,7,'r'],[10,7,'r'],[9,4,'e'],[10,4,'e']]);
GIRL.angryB = edit(GIRL.runB, [[9,6,'r'],[10,6,'r'],[11,6,'r'],[9,7,'r'],[10,7,'r'],[9,4,'e'],[10,4,'e']]);
const BOY = {
  runA: BOY_TOP.concat(legs.boyA), runB: BOY_TOP.concat(legs.boyB), stand: BOY_TOP.concat(legs.boyS),
};
BOY.hurt = edit(BOY.stand, xEye(7, 6));
BOY.hurtNoHat = noHat(BOY.hurt);

function rowsToSVG(rows) {
  let s = '';
  rows.forEach((row, y) => {
    let x = 0;
    while (x < row.length) {
      const ch = row[x];
      if (ch === '.') { x++; continue; }
      let x2 = x;
      while (x2 < row.length && row[x2] === ch) x2++;
      s += R(x, y, x2 - x, 1, PAL[ch]);
      x = x2;
    }
  });
  return s;
}

// 被雪球裹住的温知窈
function snowballSVG() {
  let s = '';
  for (let y = -13; y < 13; y++) {
    const hw = Math.floor(Math.sqrt(169 - (y + .5) * (y + .5)));
    s += R(-hw, y, hw * 2, 1, '#ffffff');
    s += R(Math.max(-hw, hw - 5), y, Math.min(5, hw * 2), 1, '#d6ebf8');
  }
  s += R(-4, -15, 8, 3, '#6b3e26') + R(3, -16, 3, 2, '#5aa8e8');   // 头发和蝶簪露在外面
  s += R(-11, 9, 4, 3, '#f29ab8') + R(7, 9, 4, 3, '#f29ab8');       // 两只脚
  s += R(-3, -5, 2, 2, '#3a2216') + R(2, -5, 2, 2, '#3a2216');      // 眼睛
  return s;
}

// ====================================================================
//  时间轴：每个角色是一串「段」，按时间求状态
// ====================================================================
const EVENTS = [];
const ev = (t, fn) => EVENTS.push({ t, fn });
const SAYS = [];
function say(who, t0, dur, text, dx = 0, dy = 0) {
  SAYS.push({ who, t0, t1: t0 + dur, text, dx, dy });
  ev(t0, () => SFX.talk(text.length, who.name));
}

class Act {
  constructor(name, x, y, flip = 1) {
    Object.assign(this, { name, x, y, flip, t: 0, segs: [] });
  }
  seg(dur, f) { this.segs.push({ t0: this.t, t1: this.t + dur, f }); this.t += dur; return this; }
  move(dur, f) {
    const end = f(1, this.t + dur);
    this.seg(dur, f);
    this.x = end.x; this.y = end.y;
    if (end.flip) this.flip = end.flip;
    return this;
  }
  wait(dur, o = {}) {
    const { x, y, flip } = this;
    return this.seg(dur, (u, t) => Object.assign({ x, y, flip, pose: 'stand' }, o, o.fx ? o.fx(u, t) : {}));
  }
  until(T, o) {
    if (T < this.t - 1e-6) console.warn(this.name, 'late by', (this.t - T).toFixed(2), 's');
    return this.wait(Math.max(0, T - this.t), o);
  }
  face(f) { this.flip = f; return this; }
  run(toX, speed, o = {}) {
    const x0 = this.x, y = this.y, dur = Math.abs(toX - x0) / speed;
    const flip = toX >= x0 ? 1 : -1, cad = o.cad || 0.12;
    this.flip = flip; this.x = toX;
    const [pa, pb] = o.poses || ['runA', 'runB'];
    return this.seg(dur, (u, t) => {
      const ph = Math.floor(t / cad) % 2;
      return Object.assign({ x: x0 + (toX - x0) * u, y: y - ph, flip, pose: ph ? pa : pb }, o.st);
    });
  }
  jump(toX, toY, h, dur, o = {}) {
    const crouch = o.crouch ?? 0.08;
    if (crouch) this.wait(crouch, Object.assign({ sx: 1.25, sy: 0.78 }, o.st, { pose: o.st?.pose || 'stand' }));
    const x0 = this.x, y0 = this.y, t0 = this.t;
    if (toX !== x0) this.flip = o.flip ?? (toX > x0 ? 1 : -1);
    const flip = this.flip;
    this.x = toX; this.y = toY;
    if (o.sfx !== null) ev(t0, () => SFX[o.sfx || (this.name === 'girl' ? 'girlJump' : 'boyJump')]());
    for (const [u, fn] of o.ev || []) ev(t0 + u * dur, fn);
    this.seg(dur, (u, t) => {
      const arc = h * (1 - Math.pow(Math.abs(2 * u - 1), 2.2));
      let sx = 1, sy = 1;
      if (u < 0.2) { const k = u / 0.2; sx = 0.8 + 0.2 * k; sy = 1.25 - 0.25 * k; }
      else if (u > 0.8) { const k = (u - 0.8) / 0.2; sx = 1 - 0.1 * k; sy = 1 + 0.12 * k; }
      const rot = o.spin ? o.spin * 360 * ease(u) : (o.rot ? o.rot(u, t) : 0);
      return Object.assign({ x: lerp(x0, toX, u), y: lerp(y0, toY, u) - arc, flip, pose: 'runA', sx, sy, rot },
        o.st, o.fx ? o.fx(u, t) : {});
    });
    if (!o.noLand) this.land(o.landSt, o.quiet);
    return this;
  }
  land(st = {}, quiet) {
    const { x, y, flip } = this;
    if (!quiet) { const t = this.t; ev(t, () => { SFX.land(); puff(x, y, 4); }); }
    return this.seg(0.22, u => {
      const d = 0.35 * Math.exp(-3.5 * u) * Math.cos(2.6 * Math.PI * u);
      return Object.assign({ x, y, flip, pose: 'stand', sx: 1 + d, sy: 1 - d }, st);
    });
  }
  climb(toY, speed) {
    const x = this.x, y0 = this.y, dur = Math.abs(toY - y0) / speed;
    return this.move(dur, (u, t) => {
      const ph = Math.floor(t / 0.16) % 2;
      return { x, y: lerp(y0, toY, u), flip: ph ? 1 : -1, pose: ph ? 'runA' : 'runB', climb: true };
    });
  }
  at(t) {
    const s = this.segs;
    if (t <= s[0].t0) return s[0].f(0, t);
    let lo = 0, hi = s.length - 1;
    while (lo < hi) { const m = (lo + hi + 1) >> 1; if (s[m].t0 <= t) lo = m; else hi = m - 1; }
    const sg = s[lo];
    const u = sg.t1 > sg.t0 ? clamp((t - sg.t0) / (sg.t1 - sg.t0), 0, 1) : 1;
    return sg.f(u, t);
  }
}

// ====================================================================
//  地图坐标（整张大地图连续，y 向下）
// ====================================================================
const GA = 200, GB = 400, GC = 200, GD = 40, GE = 230;   // 雪原 / 火山口 / 草甸 / 高原 / 终点 地面
const STONES = [985, 1030, 1075, 1120];
const ROPE = { x0: 2802, y0: -12, x1: 3172, y1: 186 };
const ropeY = x => ROPE.y0 + (x - ROPE.x0) * (ROPE.y1 - ROPE.y0) / (ROPE.x1 - ROPE.x0);
const K = {};

// ====================================================================
//  剧本
// ====================================================================
const G = new Act('girl', 40, GA, 1);
const B = new Act('boy', 130, GA, -1);
const yakT = { bonk: 0, go: 0, stop: 0 };

// ---------- 1 冰天雪地 ----------
say(G, 0.2, 1.3, '九千岁，等等我！');
G.wait(2.2);
G.run(182, 85);
// 笨：跳得太矮，脸撞冰块
G.move(0.2, u => ({ x: 182 + 10 * u, y: GA - 8 * Math.sin(u * Math.PI / 2), pose: 'runA', flip: 1 }));
K.bonk1 = G.t;
ev(K.bonk1, () => { SFX.bonk(); stars(200, GA - 12); shake(3); });
G.move(0.35, u => ({ x: 192 - 22 * u, y: GA - 8 + 12 * u - 10 * Math.sin(u * Math.PI), pose: 'hurt', flip: 1, rot: -90 * u }));
G.wait(0.8, { pose: 'hurt', rot: -90, dizzy: true });
say(G, K.bonk1 + 0.4, 0.9, '哎哟…');
G.move(0.25, u => ({ x: 170, y: GA + 4 - 4 * u, pose: 'stand', flip: 1, rot: -90 + 90 * u }));
G.jump(234, GA, 34, 0.7, { rot: u => 12 * Math.sin(u * Math.PI * 4), st: { pose: 'hurtRun' } });
G.run(260, 85);
K.snowHit = G.t;
ev(K.snowHit, () => { SFX.splat(); burst(262, GA - 14, 10, ['#fff', '#d6ebf8']); });
G.move(0.2, u => ({ x: 260, y: GA, flip: 1, ball: true, r: 5 + 8 * u }));
G.move(0.55, u => ({ x: 260 - 31 * u, y: GA - 6 * Math.sin(u * Math.PI), flip: 1, ball: true, r: 13, rot: -260 * u }));
ev(G.t, () => { SFX.thud(); shake(4); });
G.wait(0.35, { ball: true, r: 13, rot: -260, fx: (u, t) => ({ sx: 1 + .08 * Math.sin(t * 50) }) });
K.burst = G.t;
ev(K.burst, () => { SFX.crash(); burst(229, GA - 13, 22, ['#fff', '#d6ebf8', '#eaf6ff']); shake(3); });
G.wait(0.7, { pose: 'angry', angry: true });
say(G, K.burst + 0.05, 0.9, '可恶！！');
G.run(372, 170, { st: { dash: true }, poses: ['angry', 'angryB'], cad: 0.07 });
K.snowman = G.t;
ev(K.snowman, () => { SFX.crash(); burst(391, GA - 10, 26, ['#fff', '#fff', '#d6245c', '#ff8a1f']); shake(5); });
G.move(0.5, u => ({ x: 372 + 58 * u, y: GA - 14 * Math.sin(u * Math.PI), pose: 'hurt', flip: 1, rot: 360 * u }));
G.land({ pose: 'hurt' });
G.wait(0.3, { pose: 'hurt', dizzy: true });
G.run(600, 85);
K.gPipe = G.t;
say(G, K.gPipe - 1.3, 0.9, '别跑！');
G.jump(632, 176, 18, 0.45, { noLand: true });
G.move(0.25, u => ({ x: 632, y: 176 + 14 * u, pose: 'stand', flip: 1 }));
K.stuck = G.t;
ev(K.stuck, () => SFX.squeak());
say(G, K.stuck + 0.1, 1.0, '卡…卡住了！');
G.wait(1.1, { pose: 'hurt', fx: (u, t) => ({ rot: 9 * Math.sin(t * 28), sweat: true }) });
ev(G.t, () => SFX.pipe());
G.move(0.45, u => ({ x: 632, y: 190 + 254 * u * u, pose: 'hurt', flip: 1, rot: 540 * u }));
ev(G.t, () => { SFX.splat(); shake(3); });
G.wait(0.15, { pose: 'hurt', sx: 1.4, sy: 0.5, rot: 540 });
G.move(1.0, u => ({ x: 632 + 248 * u, y: 444, pose: 'hurt', flip: 1, rot: 540 + 1080 * u }));
G.move(0.3, u => ({ x: 880, y: 444 - 68 * u, pose: 'hurt', flip: 1, rot: 1620 + 180 * u }));
K.gOut = G.t;
ev(K.gOut, () => SFX.boing());
G.jump(945, GB + 4, 70, 0.8, { crouch: 0, noLand: true, rot: u => 1800 + 450 * u, st: { pose: 'hurt' }, sfx: null });
ev(G.t, () => { SFX.splat(); puff(945, GB, 6); shake(4); });
G.wait(0.6, { pose: 'hurt', rot: 90, dizzy: true });
G.move(0.25, u => ({ x: 945, y: GB + 4 - 4 * u, pose: 'stand', flip: 1, rot: 90 - 90 * u }));
K.gUp = G.t;

// 裴恕：轻松过关，还顺手使坏
B.wait(1.4, { flip: -1 });
say(B, 1.4, 1.1, '追得上再说～');
B.wait(1.0, { flip: -1 });
B.run(184, 80);
B.jump(236, GA, 30, 0.6, { spin: 1 });
B.run(360, 80).face(-1);
B.until(K.snowHit - 0.85, { flip: -1 });
B.wait(0.25, { flip: -1, sx: 1.15, sy: 0.85 });
K.throwSnow = B.t;
ev(K.throwSnow, () => SFX.throw());
B.wait(0.3, { flip: -1, pose: 'runA' });
say(B, K.snowHit - 0.1, 1.0, '哈！正中！');
B.wait(1.0, { flip: -1, fx: (u, t) => ({ sy: 1 + .06 * Math.abs(Math.sin(t * 18)) }) });
ev(B.t - 1.0, () => SFX.laugh());
B.face(1).run(362, 80);
B.jump(420, GA, 32, 0.55, { spin: 1 });
B.run(606, 80);
B.jump(632, 176, 18, 0.45);
B.face(-1);
B.until(K.gPipe - 1.6, { flip: -1 });
say(B, B.t, 0.9, '拜拜～');
B.wait(0.9, { flip: -1, fx: (u, t) => ({ rot: 6 * Math.sin(t * 14) }) });
ev(B.t, () => SFX.pipe());
B.move(0.5, u => ({ x: 632, y: 176 + 38 * u, flip: -1, pose: 'stand' }));
B.move(0.4, u => ({ x: 632, y: 214 + 230 * u, flip: 1, pose: 'stand' }));
B.move(1.0, u => ({ x: 632 + 248 * ease(u), y: 444, flip: 1, pose: 'stand' }));
B.move(0.35, u => ({ x: 880, y: 444 - 68 * u, flip: 1, pose: 'stand' }));
B.jump(912, GB, 16, 0.45, { crouch: 0 });

// ---------- 2 火山口 ----------
B.until(K.gOut + 0.6);
say(B, K.gOut + 0.9, 1.0, '真慢～');
B.until(K.gUp + 0.3);
K.bHop = B.t;
B.run(968, 80);
for (const [i, sx] of STONES.entries()) {
  B.jump(sx, GB - 2, 14, 0.32, { crouch: 0, noLand: true, sfx: 'hop' });
  if (i === 1) { K.stoneTap = B.t; ev(B.t, () => { SFX.crack(); puff(sx, GB, 3, '#6a4a3a'); }); }
  B.wait(0.06);
}
B.jump(1178, GB, 16, 0.4, { crouch: 0 });
B.run(1238, 80);
B.jump(1300, GB, 28, 0.5, { spin: 1 });
B.face(-1);

G.run(968, 85);
G.until(K.bHop + 1.0);
G.jump(985, GB - 2, 16, 0.5, { noLand: true });
say(G, G.t, 0.9, '稳住稳住…');
G.wait(0.45, { fx: (u, t) => ({ rot: 16 * Math.sin(t * 22), pose: 'hurt' }) });
G.jump(1030, GB - 2, 16, 0.5, { noLand: true });
K.sink = G.t;
ev(K.sink, () => SFX.crack());

  const b = $('banner');
  b.innerHTML = `<small>WORLD ${ZONES[z][0]}</small>${ZONES[z][1]}`;
  b.classList.add('show');
  clearTimeout(bannerTimer);
  bannerTimer = setTimeout(() => b.classList.remove('show'), 1400);
  SFX.stage();
}

// ====================================================================
//  8-bit 音效
// ====================================================================
let AC, master;
function initAudio() {
  AC = new (window.AudioContext || window.webkitAudioContext)();
  master = AC.createGain(); master.gain.value = 0.55; master.connect(AC.destination);
}
const now = () => AC.currentTime;
function tone({ type = 'square', f0, f1 = f0, dur, vol = 0.12, vib = 0, vibRate = 16, at = now(), lin = false }) {
  const o = AC.createOscillator(), gn = AC.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f0, at);
  if (f1 !== f0) lin ? o.frequency.linearRampToValueAtTime(f1, at + dur) : o.frequency.exponentialRampToValueAtTime(f1, at + dur);
  if (vib) { const l = AC.createOscillator(), lg = AC.createGain(); l.frequency.value = vibRate; lg.gain.value = vib; l.connect(lg).connect(o.frequency); l.start(at); l.stop(at + dur); }
  gn.gain.setValueAtTime(vol, at); gn.gain.exponentialRampToValueAtTime(0.0008, at + dur);
  o.connect(gn).connect(master); o.start(at); o.stop(at + dur + 0.02);
}
let noiseBuf;
function noise({ dur, vol = 0.15, freq = 800, type = 'lowpass', at = now(), f1 }) {
  if (!noiseBuf) { noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
  const s = AC.createBufferSource(), fl = AC.createBiquadFilter(), gn = AC.createGain();
  s.buffer = noiseBuf; s.loop = true; fl.type = type; fl.frequency.setValueAtTime(freq, at);
  if (f1) fl.frequency.exponentialRampToValueAtTime(f1, at + dur);
  gn.gain.setValueAtTime(vol, at); gn.gain.exponentialRampToValueAtTime(0.0008, at + dur);
  s.connect(fl).connect(gn).connect(master); s.start(at); s.stop(at + dur + 0.02);
}
const N = n => 440 * Math.pow(2, (n - 69) / 12);
const SFX = new Proxy({
  girlJump: () => tone({ f0: 380, f1: 1150, dur: 0.18, vol: 0.1 }),
  boyJump: () => tone({ f0: 200, f1: 560, dur: 0.2, vol: 0.1 }),
  hop: () => tone({ f0: 500, f1: 900, dur: 0.08, vol: 0.06 }),
  boing: () => tone({ type: 'triangle', f0: 260, f1: 900, dur: 0.55, vol: 0.22, vib: 70, vibRate: 14 }),
  spring: () => tone({ type: 'triangle', f0: 120, f1: 1400, dur: 0.7, vol: 0.25, vib: 90, vibRate: 18 }),
  land: () => { noise({ dur: 0.08, vol: 0.2, freq: 700 }); tone({ f0: 140, f1: 55, dur: 0.09, vol: 0.1 }); },
  bonk: () => { tone({ f0: 320, f1: 90, dur: 0.14, vol: 0.18 }); noise({ dur: 0.05, vol: 0.25, freq: 2000 }); },
  thud: () => { tone({ type: 'sine', f0: 140, f1: 40, dur: 0.3, vol: 0.5 }); noise({ dur: 0.18, vol: 0.3, freq: 400 }); },
  splat: () => { noise({ dur: 0.18, vol: 0.3, freq: 1200, f1: 200 }); tone({ type: 'sawtooth', f0: 300, f1: 70, dur: 0.16, vol: 0.08 }); },
  crash: () => { noise({ dur: 0.35, vol: 0.35, freq: 2500, f1: 300 }); [0, .05, .1].forEach(d => tone({ f0: 600 - d * 2000, f1: 200, dur: 0.1, vol: 0.06, at: now() + d })); },
  slip: () => { tone({ type: 'sine', f0: 500, f1: 2000, dur: 0.22, vol: 0.18 }); tone({ type: 'sine', f0: 2000, f1: 180, dur: 0.45, vol: 0.18, at: now() + 0.22 }); },
  pop: () => tone({ type: 'sine', f0: 400, f1: 1300, dur: 0.09, vol: 0.2 }),
  squeak: () => { tone({ f0: 900, f1: 1500, dur: 0.07, vol: 0.08 }); tone({ f0: 1500, f1: 900, dur: 0.07, vol: 0.08, at: now() + 0.07 }); },
  scream: () => { tone({ type: 'sawtooth', f0: 600, f1: 1500, dur: 0.7, vol: 0.09, vib: 60, vibRate: 22 }); noise({ dur: 0.7, vol: 0.12, freq: 3000, type: 'highpass' }); },
  fizz: () => noise({ dur: 0.55, vol: 0.14, freq: 2600, type: 'highpass' }),
  crack: () => { noise({ dur: 0.06, vol: 0.25, freq: 3000 }); noise({ dur: 0.05, vol: 0.2, freq: 1500, at: now() + 0.07 }); },
  rumble: () => { noise({ dur: 1.2, vol: 0.3, freq: 180 }); tone({ type: 'sine', f0: 55, f1: 45, dur: 1.2, vol: 0.2 }); },
  erupt: () => { noise({ dur: 1.4, vol: 0.4, freq: 150, f1: 1200 }); tone({ type: 'sawtooth', f0: 60, f1: 500, dur: 1.2, vol: 0.08 }); },
  kick: () => { tone({ f0: 200, f1: 60, dur: 0.12, vol: 0.2 }); noise({ dur: 0.08, vol: 0.2, freq: 900 }); },
  throw: () => noise({ dur: 0.2, vol: 0.18, freq: 800, f1: 4000, type: 'bandpass' }),
  whoosh: () => noise({ dur: 0.9, vol: 0.2, freq: 400, f1: 3000, type: 'bandpass' }),
  coin: () => { tone({ f0: N(84), dur: 0.08, vol: 0.08 }); tone({ f0: N(91), dur: 0.35, vol: 0.08, at: now() + 0.08 }); },
  pipe: () => [0, 1, 2].forEach(i => tone({ f0: 520 - i * 110, f1: 300 - i * 70, dur: 0.1, vol: 0.12, at: now() + i * 0.11 })),
  vine: () => [60, 64, 67, 72, 76, 79, 84, 88].forEach((n, i) => tone({ type: 'triangle', f0: N(n), dur: 0.12, vol: 0.12, at: now() + 0.1 + i * 0.09 })),
  shakeVine: () => { for (let i = 0; i < 6; i++) noise({ dur: 0.06, vol: 0.15, freq: 1800, type: 'bandpass', at: now() + i * 0.09 }); },
  moo: () => { tone({ type: 'sawtooth', f0: 150, f1: 110, dur: 0.8, vol: 0.14, vib: 8, vibRate: 6 }); },
  skid: () => noise({ dur: 0.35, vol: 0.2, freq: 1500, f1: 500, type: 'bandpass' }),
  wind: () => noise({ dur: 1.6, vol: 0.25, freq: 500, f1: 1400, type: 'bandpass' }),
  zip: d => { noise({ dur: d, vol: 0.12, freq: 2000, f1: 5000, type: 'highpass' }); tone({ type: 'sawtooth', f0: 200, f1: 700, dur: d, vol: 0.03, lin: true }); },
  stomp: () => { tone({ type: 'sine', f0: 110, f1: 50, dur: 0.15, vol: 0.35 }); },
  laugh: () => [0, 1, 2, 3].forEach(i => tone({ f0: 420 - i * 30, f1: 360 - i * 30, dur: 0.08, vol: 0.08, at: now() + i * 0.12 })),
  surprise: () => tone({ type: 'triangle', f0: 300, f1: 1400, dur: 0.25, vol: 0.2 }),
  fight: d => { for (let i = 0; i < d / 0.08; i++) { const a = now() + i * 0.08; (i % 3 ? noise({ dur: 0.06, vol: 0.18, freq: 600 + (i * 397) % 2000, type: 'bandpass', at: a }) : tone({ f0: 200 + (i * 211) % 900, dur: 0.05, vol: 0.06, at: a })); } },
  talk: (n, who) => { const [lo, hi] = who === 'girl' ? [620, 980] : [230, 420]; for (let i = 0; i < n * 2; i++) { const f = lo + Math.random() * (hi - lo); tone({ f0: f, f1: f * (Math.random() < .5 ? 1.25 : .8), dur: 0.06, vol: 0.06, at: now() + i * 0.07 }); } },
  stage: () => [72, 76, 79, 84].forEach((n, i) => tone({ f0: N(n), dur: 0.1, vol: 0.07, at: now() + i * 0.07 })),
  heart: () => { [0, 0.22].forEach(d => tone({ type: 'sine', f0: 90, f1: 50, dur: 0.14, vol: 0.4, at: now() + d })); tone({ type: 'sine', f0: 1568, dur: 0.35, vol: 0.12, at: now() + 0.5 }); tone({ type: 'sine', f0: 2093, dur: 0.5, vol: 0.12, at: now() + 0.62 }); },
  win: () => {
    const mel = [[72, 0], [76, .12], [79, .24], [84, .36], [79, .6], [84, .72], [88, .9]];
    mel.forEach(([n, d], i) => tone({ f0: N(n), dur: i === mel.length - 1 ? 0.8 : 0.14, vol: 0.09, at: now() + d }));
    [48, 55, 60].forEach((n, i) => tone({ type: 'triangle', f0: N(n), dur: 0.4, vol: 0.18, at: now() + i * .3 }));
  },
}, { get: (o, k) => (...a) => { if (AC && o[k]) o[k](...a); } });

// 背景音乐（原创小调），追到时停
const BPM = 168, E8 = 60 / BPM / 2;
const MEL = [72,76,79,76,81,79,76,74, 72,76,79,84,83,79,76,79, 77,81,84,81,79,76,72,76, 74,77,81,79,77,74,71,74];
const BASS = [48,43,48,43, 48,43,52,43, 41,48,41,48, 43,50,43,47];
let musicIdx = 0;
function pumpMusic(t, acNow) {
  while (true) {
    const nt = musicIdx * E8;
    if (nt > K.crash - 0.1 || nt > t + 0.25) break;
    if (nt >= t - 0.02) {
      const at = acNow + (nt - t);
      tone({ f0: N(MEL[musicIdx % MEL.length]), dur: E8 * 0.85, vol: 0.03, at });
      if (musicIdx % 2 === 0) tone({ type: 'triangle', f0: N(BASS[(musicIdx / 2) % BASS.length]), dur: E8 * 1.8, vol: 0.11, at });
      if (musicIdx % 4 === 2) noise({ dur: 0.04, vol: 0.04, freq: 6000, type: 'highpass', at });
    }
    musicIdx++;
  }
}

// ====================================================================
//  主循环
// ====================================================================
EVENTS.sort((a, b) => a.t - b.t);
const world = $('world');
let t0 = 0, last = 0, evIdx = 0, running = false;
const cam = { x: 0, y: 0 };
function camTarget(gs, bs) {
  const gx = gs.hidden ? bs.x : gs.x;
  const lead = clamp((bs.x - gx) * 0.45, -40, 90);
  return { x: clamp(gx + lead - 150, X0 + 10, X1 - 330), y: gs.y - 128 };
}
function frame() {
  if (!running) return;
  const acNow = now();
  const t = Math.min(acNow - t0, K.end + 0.5);
  const dt = Math.min(0.05, Math.max(0, t - last));
  while (evIdx < EVENTS.length && EVENTS[evIdx].t <= t) { EVENTS[evIdx].fn(); evIdx++; }
  pumpMusic(t, acNow);
  for (const f of P) f(t);
  ambientUpdate(t);
  const gs = girl.render(t), bs = boy.render(t);
  const tg = camTarget(gs, bs);
  const k = 1 - Math.exp(-dt * 4.5);
  cam.x += (tg.x - cam.x) * k; cam.y += (tg.y - cam.y) * k;
  shakeAmp *= Math.exp(-dt * 7);
  const sxk = shakeAmp > .2 ? (Math.random() - .5) * shakeAmp : 0, syk = shakeAmp > .2 ? (Math.random() - .5) * shakeAmp : 0;
  tr(world, `translate(${(-cam.x + sxk).toFixed(1)},${(-cam.y + syk).toFixed(1)})`);
  updateParts(dt, t);
  updateBubbles(t, cam);
  setZone(zoneOf(gs.hidden ? bs : gs));
  $('gap').setAttribute('width', (100 * (1 - clamp((bs.x - gs.x - 16) / 120, 0, 1))).toFixed(1));
  last = t;
  requestAnimationFrame(frame);
}
function reset() {
  parts.forEach(p => p.e.remove()); parts = [];
  evIdx = 0; musicIdx = 0; last = 0; curZone = -1; shakeAmp = 0; won = false;
  $('banner').classList.remove('show'); $('banner').style.color = '';
  const gs = G.at(0), bs = B.at(0), tg = camTarget(gs, bs);
  cam.x = tg.x; cam.y = tg.y;
}
function paint(t) {
  for (const f of P) f(t);
  ambientUpdate(t);
  const gs = girl.render(t), bs = boy.render(t);
  const tg = camTarget(gs, bs);
  cam.x = tg.x; cam.y = tg.y;
  tr(world, `translate(${-cam.x},${-cam.y})`);
  updateBubbles(t, cam);
}
const overlay = $('overlay'), muteBtn = $('mute');
function start() {
  if (!AC) initAudio();
  AC.resume();
  reset();
  t0 = now();
  running = true;
  overlay.classList.add('hidden');
  muteBtn.hidden = false;
  requestAnimationFrame(frame);
}
function showReplay() {
  overlay.innerHTML = '<button class="btn" id="start">↻ 再看一遍</button>';
  overlay.style.background = 'transparent';
  overlay.style.alignItems = 'flex-end'; overlay.style.justifyContent = 'flex-end'; overlay.style.padding = '0 24px 60px 0';
  overlay.classList.remove('hidden');
  $('start').addEventListener('click', () => { running = false; overlay.classList.add('hidden'); setTimeout(start, 30); });
}
$('start').addEventListener('click', start);
muteBtn.addEventListener('click', () => {
  const on = master.gain.value > 0;
  master.gain.value = on ? 0 : 0.55;
  muteBtn.textContent = on ? '🔇 静音' : '🔊 声音';
});
reset();
paint(0);
// 调试：在控制台用 seek(秒) 查看某一时刻
window.seek = t => { running = false; paint(t); setZone(zoneOf(G.at(t).hidden ? B.at(t) : G.at(t))); return t; };
window.K = K;
</script>
